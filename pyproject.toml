[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "exo-tbccl"
version = "0.1.0"
description = "TBCCL pipeline communication backend for exo (MLX arrays over the TBCCL C ABI v1)"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.4.0"]

[tool.scikit-build]
wheel.packages = ["exo_tbccl"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]
