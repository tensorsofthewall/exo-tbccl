name: benchmark-provider
# The Exo benchmark provider's offline tests. They need no framework, no model, no GPU and no second host,
# and they assert no performance threshold. Pull requests run them on both supported operating systems.
on:
  pull_request:
    paths:
      - "benchmarks/provider/**"
      - ".github/workflows/benchmark-provider.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/provider/**"
jobs:
  provider:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Describe the provider (no framework is installed)
        run: python benchmarks/provider/provider.py describe
      - name: Provider tests (offline)
        run: python -m unittest discover -s benchmarks/provider/tests -p 'test_*.py'
