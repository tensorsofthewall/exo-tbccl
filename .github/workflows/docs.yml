name: docs
on:
  pull_request:
  push:
    branches: [main]
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build documentation (warnings are errors)
        run: make docs
      - name: Check local links
        run: make docs-linkcheck
      - name: Check the compatibility manifest
        run: python3 tools/check_compatibility_manifest.py
      - name: Check the release state (offline)
        run: python3 tools/check_release_state.py
      - name: Check that the documentation describes the current release (offline)
        run: python3 tools/check_release_docs.py
      - name: Test the release-documentation check (stale releases must fail)
        run: python3 -m unittest tests/test_release_docs.py
      - name: Test the branding assets (portable SVG, unchanged mark, README and docs references)
        run: python3 -m unittest tests/test_branding_assets.py
      - name: Test the landing page (structure, ecosystem navigation, claims)
        run: python3 -m unittest tests/test_landing_page.py
      - name: Check the benchmark charts are current
        run: python3 tools/benchmark_charts.py --check
      - name: Test the benchmark charts (source agreement, validity, determinism)
        run: python3 -m unittest tests/test_benchmark_charts.py
      - name: Check the commands named in the documentation (static; nothing is run or downloaded)
        run: python3 tools/check_doc_commands.py
      - name: Test the onboarding, troubleshooting and contributor pages
        run: python3 -m unittest tests/test_docs_usability.py
      - name: Check the README against the release metadata (offline)
        run: python3 tools/check_readme.py
      - name: Test the README check
        run: python3 -m unittest tests/test_readme.py
      - name: Check the repository-internal links (offline)
        run: python3 tools/check_links.py
      - name: Test the maintenance tooling
        run: python3 -m unittest tests/test_maintenance_tools.py
      - name: Check the framework pin (offline)
        run: python3 tools/check_framework_pin.py
