<figcaption>Closed loop, Qwen3-0.6B-8bit. Passes are pooled per backend and stage order and are not independent: the lifecycles behind each line are 1 (MlxRing, both orders) and 2 (MlxTbccl, Linux-first), and the first pass of a lifecycle was often the highest. Values are output tokens per second, passes pooled per backend and stage order (3 passes for MlxRing, 6 for MlxTbccl); passes inside a lifecycle are not independent. Exact figures are in the table below the chart.</figcaption>
